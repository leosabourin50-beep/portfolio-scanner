name: Portfolio Scanner Cron

on:
  # Every 30 min during US market hours, Mon-Fri.
  # 13:30–20:30 UTC = 9:30 AM – 4:30 PM ET (during DST). The window is
  # widened by 30 min on each side so EST (winter, UTC-5) is also covered.
  schedule:
    - cron: '*/30 13-21 * * 1-5'
  # Manual trigger from the Actions UI for testing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip Telegram send)'
        required: false
        default: 'false'

# Read-only: dedup state is persisted via actions/cache now, not committed
# back to the repo, so the job no longer needs write access (and no longer
# floods git history with "update alert state" commits or risks push races).
permissions:
  contents: read

concurrency:
  group: scanner-cron
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Restore the dedup state + alert log from the most recent run. A unique
      # key means the exact key never hits, so the cache is always (re)saved at
      # job end with the latest state; restore-keys pulls the newest prior one.
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: |
            .alerts_state.json
            .alert_log.jsonl
          key: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scanner-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          POLYGON_API_KEY:    ${{ secrets.POLYGON_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN:            ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python scanner_cron.py
