# fly.toml app configuration file generated for portfolio-watcher on 2026-05-14T14:14:17-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'portfolio-watcher'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.watcher'

[deploy]
  strategy = 'immediate'

[env]
  ALERTS_STATE_PATH = '/data/intraday_alerts_state.json'
  PER_TICKER_LIMIT = '3'
  PYTHONUNBUFFERED = '1'
  WATCHER_POLL_SEC = '60'
  WATCHLIST_PATH = '/data/intraday_watchlist.json'

[[mounts]]
  source = 'watcher_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
